[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-3d-factory"
version = "0.1.0"
description = "Local-first CLI for creating, validating, previewing, and packaging 3D print projects for human slicer review."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Owen Reagan" }]

dependencies = [
    "typer>=0.12",
    "jsonschema>=4.21",
    "trimesh>=4.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
factory = "factory.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
